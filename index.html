<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link type="text/css" rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Audiowide">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Trirong">
    <link href='https://fonts.googleapis.com/css?family=Orbitron' rel='stylesheet'>
      <link rel="manifest" href="manifest.json">
    <style>
        @media print {
            #keyInputArea { display: none; }
        }
        #showScroll { cursor: pointer; }
    </style>
</head>
<body>
    <div id="showScroll" class="container">
        <div class="receipt">
            <div class="logo">
                <div class='companyName'>FAMILY</div>
                <div class='slogan' id='currentDate'></div>
            </div>
                                                
            <div class="address">
                ใบเสร็จอิเล็กทรอนิกส์<br>
            </div>

            <div class="transactionDetails" style="display:none;">
                <div class="detail">Reg#17</div>
                <div class="detail">TRN#1313</div>
                <div class="detail">CSHR#00097655</div>
                <div class="detail">str#9852</div>
            </div>

            <div class="feedback">
                <div class="break">
                    <div id="keyInputArea">
                        <input type="text" id="key2" width="100%" placeholder="secret key" oninput="dec()">
                        <br><br>
                    </div>
                    
                    <div class="survey"><b>รายรับ:</b></div>
                    <div id="incomeList"></div>
                    
                    <div class="break">**********************************</div>

                    <div class="survey"><b>รายจ่าย:</b></div>
                    <div id="expenseList"></div>

                    <div class="break">**********************************</div>

                    <div class="transactionDetails">
                        <div class="detail">รวมรายจ่าย</div>
                        <div class="detail" id='total'>0.00</div>
                    </div>
                    <div class="transactionDetails">
                        <div class="detail"></div>
                        <div class="detail" id='totalText' style="font-size: 0.8em; font-weight: normal;"></div>
                    </div>

                    <div class="tripSummary">
                        <div>คงเหลือสุทธิ: <br></div>            
                        <div class="transactionDetails">
                            <div class="detail"></div>
                            <div class="detail" id='equity' style="font-size: 1.2em;">0.00</div>
                        </div>
                    </div>
                </div>
                <p class="center">ขอบพระคุณครับ</p>   
                <div class="break">**********************************</div>
            </div>
        </div>
    </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
// ระบบแสดงวันที่ปัจจุบันอัตโนมัติ
function setCurrentDate() {
    const now = new Date();
    const day = now.getDate();
    const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
    const month = months[now.getMonth()];
    const year = now.getFullYear() + 543;
    
    document.getElementById('currentDate').innerText = `${day} ${month} ${year}`;
}
setCurrentDate();

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz-R4HD5QjLH2_wiLpl2A8gqkrjYz25idpvRdx4X7a76vtMVV18nFwbeKckhAtAqvA88Q/exec";

async function dec() {
    const key = document.getElementById('key2').value;
    if (!key || key.length < 4) return; 

    try {
        const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({ password: key })
        });
        const result = await response.json();

        if (result.status === "success") {
            document.getElementById('keyInputArea').style.display = 'none';
            processAndDisplay(result.data);
        }
    } catch (error) {
        console.error("Connection Error:", error);
    }
}

function processAndDisplay(data) {
    const incomeContainer = document.getElementById('incomeList');
    const expenseContainer = document.getElementById('expenseList');
    
    incomeContainer.innerHTML = ""; 
    expenseContainer.innerHTML = ""; 
    
    let totalIncome = 0;
    let totalExpense = 0;

    data.forEach(function(row) {
        if (row[0] && row[1]) {
            const expName = row[0];
            const expAmount = parseFloat(row[1]) || 0;
            totalExpense += expAmount;
            
            const div = document.createElement('div');
            div.className = "transactionDetails";
            div.innerHTML = `<div class="detail" style="font-size: 0.85em; font-weight: normal;">${expName}</div><div class="detail" style="font-size: 0.85em; font-weight: normal;">${expAmount.toLocaleString('en-US', {minimumFractionDigits: 2})}</div>`;
            expenseContainer.appendChild(div);
        }

        if (row[3] && row[4]) {
            const incName = row[3];
            const incAmount = parseFloat(row[4]) || 0;
            totalIncome += incAmount;
            
            const div = document.createElement('div');
            div.className = "transactionDetails";
            div.innerHTML = `<div class="detail" style="font-size: 0.85em; font-weight: normal;">${incName}</div><div class="detail" style="font-size: 0.85em; font-weight: normal;">${incAmount.toLocaleString('en-US', {minimumFractionDigits: 2})}</div>`;
            incomeContainer.appendChild(div);
        }
    });

    const netEquity = totalIncome - totalExpense;
    
    document.getElementById("total").innerHTML = totalExpense.toLocaleString('en-US', {minimumFractionDigits: 2});
    document.getElementById("equity").innerHTML = netEquity.toLocaleString('en-US', {minimumFractionDigits: 2});

    renderThaiText(totalExpense);
}

function renderThaiText(sum) {
    var n0 = sum.toFixed(2).toString(); 
    var n1 = n0.replace(/,/g,"");
    var sName = n1.split(".");
    var t1 = Array.from(sName[0]);
    var t11 = t1.reverse();
    var t2 = Array.from(sName[1]);

    const panLan = new Map([['',''],['0',''],['1','หนึ่งพัน'],['2','สองพัน'],['3','สามพัน'],['4','สี่พัน'],['5','ห้าพัน'],['6','หกพัน'],['7','เจ็ดพัน'],['8','แปดพัน'],['9','เก้าพัน']]);
    const roiLan = new Map([['',''],['0',''],['1','หนึ่งร้อย'],['2','สองร้อย'],['3','สามร้อย'],['4','สี่ร้อย'],['5','ห้าร้อย'],['6','หกร้อย'],['7','เจ็ดร้อย'],['8','แปดร้อย'],['9','เก้าร้อย']]);
    const sipLan = new Map([['0',''],['1','สิบ'],['2','ยี่สิบ'],['3','สามสิบ'],['4','สี่สิบ'],['5','ห้าสิบ'],['6','หกสิบ'],['7','เจ็ดสิบ'],['8','แปดสิบ'],['9','เก้าสิบ']]);
    const lan = new Map([['0','ล้าน'],['1','หนึ่งล้าน'],['2','สองล้าน'],['3','สามล้าน'],['4','สี่ล้าน'],['5','ห้าล้าน'],['6','หกล้าน'],['7','เจ็ดล้าน'],['8','แปดล้าน'],['9','เก้าล้าน']]);
    const lan2 = new Map([['1','เอ็ดล้าน'],['2','สองล้าน'],['3','สามล้าน'],['4','สี่ล้าน'],['5','ห้าล้าน'],['6','หกล้าน'],['7','เจ็ดล้าน'],['8','แปดล้าน'],['9','เก้าล้าน'],['0','ล้าน']]);
    const saen = new Map([['0',''],['1','หนึ่งแสน'],['2','สองแสน'],['3','สามแสน'],['4','สี่แสน'],['5','ห้าแสน'],['6','หกแสน'],['7','เจ็ดแสน'],['8','แปดแสน'],['9','เก้าแสน']]);
    const muen = new Map([['0',''],['1','หนึ่งหมื่น'],['2','สองหมื่น'],['3','สามหมื่น'],['4','สี่หมื่น'],['5','ห้าหมื่น'],['6','หกหมื่น'],['7','เจ็ดหมื่น'],['8','แปดหมื่น'],['9','เก้าหมื่น']]);
    const pan = new Map([['0',''],['1','หนึ่งพัน'],['2','สองพัน'],['3','สามพัน'],['4','สี่พัน'],['5','ห้าพัน'],['6','หกพัน'],['7','เจ็ดพัน'],['8','แปดพัน'],['9','เก้าพัน']]);
    const roi = new Map([['0',''],['1','หนึ่งร้อย'],['2','สองร้อย'],['3','สามร้อย'],['4','สี่ร้อย'],['5','ห้าร้อย'],['6','หกร้อย'],['7','เจ็ดร้อย'],['8','แปดร้อย'],['9','เก้าร้อย']]);
    const sip = new Map([['0',''],['1','สิบ'],['2','ยี่สิบ'],['3','สามสิบ'],['4','สี่สิบ'],['5','ห้าสิบ'],['6','หกสิบ'],['7','เจ็ดสิบ'],['8','แปดสิบ'],['9','เก้าสิบ']]);
    const nuoi = new Map([['0',''],['1','หนึ่ง'],['2','สอง'],['3','สาม'],['4','สี่'],['5','ห้า'],['6','หก'],['7','เจ็ด'],['8','แปด'],['9','เก้า']]);
    const nuoi2 = new Map([['0',''],['1','เอ็ด'],['2','สอง'],['3','สาม'],['4','สี่'],['5','ห้า'],['6','หก'],['7','เจ็ด'],['8','แปด'],['9','เก้า']]);
    const satang10 = new Map([['',' '],['0',''],['1','สิบ'],['2','ยี่สิบ'],['3','สามสิบ'],['4','สี่สิบ'],['5','ห้าสิบ'],['6','หกสิบ'],['7','เจ็ดสิบ'],['8','แปดสิบ'],['9','เก้าสิบ']]);
    const satang1 = new Map([['',''],['0',''],['1','หนึ่ง'],['2','สอง'],['3','สาม'],['4','สี่'],['5','ห้า'],['6','หก'],['7','เจ็ด'],['8','แปด'],['9','เก้า']]);

    var namePanLan = panLan.get(t11[9]) || "";
    var nameRoiLan = roiLan.get(t11[8]) || "";
    var nameSipLan = sipLan.get(t11[7]) || "";
    var nameLan = (t11[7]) ? lan2.get(t11[6]) : (lan.get(t11[6]) || "");
    var nameSaen = saen.get(t11[5]) || "";
    var nameMuen = muen.get(t11[4]) || "";
    var namePan = pan.get(t11[3]) || "";
    var nameRoi = roi.get(t11[2]) || "";
    var nameSip = sip.get(t11[1]) || "";
    var nameNuoi = (t11[1] && t11[1] != '0') ? (nuoi2.get(t11[0]) || "") : (nuoi.get(t11[0]) || "");

    var leadNumber = namePanLan + nameRoiLan + nameSipLan + nameLan + nameSaen + nameMuen + namePan + nameRoi + nameSip + nameNuoi;
    var bathUnit = (sum == 0) ? "ศูนย์บาท" : (sName[1] == "00" ? "บาทถ้วน" : "บาท");
    
    var nameSipSatang = satang10.get(t2[0]) || "";
    var nameNuoiSatang = satang1.get(t2[1]) || "";
    var satangUnit = (sName[1] == "00") ? "" : "สตางค์";

    document.getElementById("totalText").innerHTML = "(" + leadNumber + bathUnit + nameSipSatang + nameNuoiSatang + satangUnit + ")";
}

function captureReceipt() {
    const receiptElement = document.querySelector(".receipt");
    
    html2canvas(receiptElement, {
        scale: 1.5, 
        backgroundColor: "#ffffff",
        useCORS: true
    }).then(canvas => {
        let link = document.createElement('a');
        let dateStr = new Date().toISOString().slice(0,10).replace(/-/g,"");
        link.download = 'MONTE_Receipt_' + dateStr + '.jpg';
        link.href = canvas.toDataURL('image/jpeg', 0.8);
        link.click();
    });
}

let lastTap = 0;
document.getElementById('showScroll').addEventListener('touchend', function(e) {
    let currentTime = new Date().getTime();
    let tapLength = currentTime - lastTap;
    if (tapLength < 500 && tapLength > 0) {
        captureReceipt();
        e.preventDefault();
    }
    lastTap = currentTime;
});

document.getElementById('showScroll').addEventListener('dblclick', function() {
    captureReceipt();
});

</script>
</body>
</html>
